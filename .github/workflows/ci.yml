name: CI

# Runs on every pull request and on pushes to the long-lived branches. Without this
# a contributor's PR is unverified: the typecheck and the tests only help if
# something runs them before review.
on:
  pull_request:
  push:
    branches: [main]

# A new push to the same PR cancels the previous run — no value in finishing a
# check against code that has already been replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    name: core (typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # `--frozen-lockfile` fails rather than silently resolving a different tree
      # than the one committed, so CI tests what the lockfile describes.
      - name: Install
        run: bun install --frozen-lockfile

      # Expected to be clean. It reached zero only recently, and the four real bugs
      # it was hiding — including a Playwright call to a method that does not exist —
      # are the argument for keeping it that way.
      - name: Typecheck
        run: bun run check

      # No database or S3 required: every test runs against in-memory doubles of the
      # module interfaces. Anything needing a live Postgres belongs in a separate
      # integration job, not here.
      - name: Test
        run: bun test

  # ── web ─────────────────────────────────────────────────────────────────────
  #
  # These three jobs are new, and the reason they exist is what happened without
  # them. `core` was the only job, so nothing in `web/` ran on a pull request —
  # and every one of its Playwright specs had rotted undetected:
  #
  #   - all 6 auth tests located fields by hardcoded id (`#signin-email`), which
  #     stopped existing when the forms moved to `useId()`. Each one timed out for
  #     30 seconds and had been failing for as long as that refactor was in.
  #   - 7 more across dashboard, funnels, heatmaps, replays and settings were
  #     mocking endpoints and response shapes the clients no longer use.
  #
  # None of that is visible locally either, because nobody runs `test:e2e` by hand.
  # A test suite that nothing executes is documentation, and out-of-date
  # documentation at that.

  web-typecheck:
    name: web (typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `npm ci` rather than `npm install`, for the same reason core uses
      # `--frozen-lockfile`. `postinstall` runs `patch-package` and bundles the
      # tracker, both of which the typecheck needs.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  web-unit:
    name: web (unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      # Vitest + jsdom. No backend: these mock the api clients.
      - name: Test
        run: npm test

  web-e2e:
    name: web (e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      # Chromium only — `playwright.config.ts` defines the one project, and
      # `--with-deps` installs the system libraries the runner image lacks.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # `playwright.config.ts` starts `next dev` itself via `webServer`, so there is
      # no separate build-and-serve step. Every backend call is mocked through
      # `e2e/helpers/mock-api.ts`; no gateway, Postgres or S3 is involved.
      #
      # `NEXT_PUBLIC_API_URL` is deliberately left same-origin. Locally it resolves to
      # an absolute `http://localhost:8080` from the developer's `.env`, which is why
      # the route globs in the specs are anchored on `/api/v1/` rather than on a host.
      - name: Test
        run: npm run test:e2e
        env:
          CI: true

      # The HTML report is the only way to see why a run failed after the fact —
      # traces are captured on the first retry, which CI enables.
      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  production-images:
    name: production Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This catches broken standalone output, missing runtime files, and accidental
      # development-only dependencies before a deployment ever reaches a registry.
      - name: Build core image
        run: docker build --file core/Dockerfile --tag seentics-core:ci core

      - name: Build web image
        run: >-
          docker build --file web/Dockerfile --tag seentics-web:ci
          --build-arg API_GATEWAY_URL=http://api:8080
          --build-arg NEXT_PUBLIC_API_URL=/api/v1
          web
